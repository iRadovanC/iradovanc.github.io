<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07100f" />
    <meta
      name="description"
      content="Nulový bod — rychlá 2D střelecká hra pro myš, klávesnici i dotyk."
    />
    <title>Nulový bod</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Hra Nulový bod">
      <canvas id="game" aria-label="Herní plocha"></canvas>

      <div class="vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <header class="hud" aria-live="polite">
        <section class="hud-block score-block">
          <span class="hud-label">SKÓRE</span>
          <strong id="score">000000</strong>
          <span class="record">REKORD <b id="highScore">000000</b></span>
        </section>

        <section class="timer-block" aria-label="Zbývající čas">
          <svg class="timer-ring" viewBox="0 0 60 60" aria-hidden="true">
            <circle class="timer-track" cx="30" cy="30" r="25"></circle>
            <circle id="timerProgress" class="timer-progress" cx="30" cy="30" r="25"></circle>
          </svg>
          <strong id="time">60</strong>
          <span>SEKUND</span>
        </section>

        <section class="hud-block status-block">
          <span class="hud-label">PŘESNOST</span>
          <strong id="accuracy">—</strong>
          <span class="record">SÉRIE <b id="combo">×1</b></span>
        </section>
      </header>

      <section class="bottom-hud" aria-label="Stav zbraně a hráče">
        <div class="armor" id="armor" aria-label="Odolnost 3 ze 3">
          <span></span><span></span><span></span>
        </div>
        <div class="ammo-wrap">
          <span id="reloadText">PŘIPRAVEN</span>
          <div class="ammo" id="ammo" aria-label="Munice 8 z 8"></div>
        </div>
      </section>

      <section id="overlay" class="overlay is-visible" aria-labelledby="overlayTitle">
        <div class="mission-tag"><i></i> STŘELNICE 07</div>
        <h1 id="overlayTitle">NULOVÝ<br /><em>BOD</em></h1>
        <p id="overlayText" class="lead">
          Máš 60 sekund. Zasahuj cíle, drž sérii<br class="wide-only" />
          a nenech protivníky vystřelit.
        </p>

        <div id="result" class="result" hidden>
          <span>VÝSLEDNÉ SKÓRE</span>
          <strong id="finalScore">0</strong>
          <p id="newRecord" hidden>NOVÝ REKORD</p>
        </div>

        <button id="startButton" type="button">
          <span id="startButtonLabel">ZAHÁJIT MISI</span>
          <b aria-hidden="true">→</b>
        </button>

        <div class="controls" aria-label="Ovládání">
          <span><kbd>MYŠ / DOTYK</kbd> MÍŘENÍ A STŘELBA</span>
          <span><kbd>ŠIPKY / WASD</kbd> MÍŘENÍ</span>
          <span><kbd>MEZERNÍK</kbd> VÝSTŘEL</span>
          <span><kbd>R</kbd> PŘEBITÍ</span>
        </div>
      </section>

      <div id="message" class="message" aria-live="assertive"></div>
      <button id="soundToggle" class="sound-toggle" type="button" aria-label="Vypnout zvuk" title="Zvuk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-4v8a4.5 4.5 0 0 0 2-4Zm-2-7.5v2a6.5 6.5 0 0 1 0 11v2a8.5 8.5 0 0 0 0-15Z" />
        </svg>
      </button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
