<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Rozejděte se, není tu nic k vidění! Fotografická scéna s několika podezřelými detaily.">
  <title>Rozejděte se, není tu nic k vidění!</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f4bd69'/%3E%3Cpath d='M19 42 31 15l14 27H19Z' fill='%2324201d'/%3E%3Ccircle cx='32' cy='35' r='3' fill='%23f4bd69'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/street-photo.png" as="image">
  <link rel="preload" href="assets/face-tongue.png" as="image">
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="script.js?v=5" defer></script>
</head>
<body>
  <main class="world" id="world">
    <div class="scene-shell" id="scene-shell">
      <div class="torn-mat" aria-hidden="true"></div>
      <div class="photograph" id="photograph">
        <div class="photo-image" aria-hidden="true"></div>
        <div class="photo-shade" aria-hidden="true"></div>
        <div class="film-grain" aria-hidden="true"></div>
        <img class="blast-layer" src="assets/blast-cutout.png" alt="" aria-hidden="true">
        <div class="flash-beam" aria-hidden="true"></div>
        <div class="runaway-shadow" aria-hidden="true"><img src="assets/drebin-cutout.png" alt=""></div>
      </div>

      <div class="headline">
        <span class="scene-kicker">PŠŠŠT... TADY SE NIC NEDĚJE</span>
        <h1>Rozejděte se,<br><em>není tu nic</em><br>k vidění!</h1>
        <p class="whisper">Pro jistotu se ale rozhlédněte.</p>
      </div>

      <div class="leslie">
        <img src="assets/drebin-cutout.png" alt="Leslie Nielsen stojí s kamennou tváří před vybuchující ulicí.">
      </div>

      <button class="scene-object lamp" type="button" data-egg="lamp" aria-label="Prohlédnout pouliční lampu"><span aria-hidden="true">✧</span></button>
      <button class="scene-object blast" type="button" data-egg="blast" aria-label="Dotknout se výbuchu"><span class="sr-only">Výbuch</span></button>
      <button class="scene-object shadow-trigger" type="button" data-egg="shadow" aria-label="Dotknout se Leslieho stínu"><span class="sr-only">Stín</span></button>

      <div class="egg-face egg-face-shock" id="face-shock" aria-hidden="true"><img src="assets/face-shock.png" alt=""></div>
    </div>
    <p class="sr-only" id="reaction" role="status" aria-live="polite"></p>
  </main>
  <img class="scene-cursor" id="scene-cursor" src="assets/face-tongue.png" alt="" aria-hidden="true" draggable="false">
  <!-- Výrazy Leslieho Nielsena byly upraveny podle snímků Everyeye a Celebrity Net Worth. -->
</body>
</html>
